<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar History Timeline</title>
    <style>
        :root {
            --color-primary: #505050;
            --color-secondary: #ffffff;
            --color-border: #8c8c8c;
            --color-light-border: #ebebeb;
            --color-light-background: #f6f6f6;
            --font-small: 0.9em;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #333;
        }

        .table-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            border: 2px solid var(--color-border);
            width: 100%;
            max-width: 100%;
            table-layout: auto;
        }

        th,
        td {
            padding: 8px;
            text-align: center;
            font-size: var(--font-small);
            border: 1px solid var(--color-light-border);
            white-space: nowrap;
        }

        th {
            background-color: var(--color-primary);
            color: var(--color-secondary);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th:first-child,
        td:first-child {
            background-color: var(--color-secondary);
            position: sticky;
            left: 0;
            z-index: 99;
            text-align: left;
        }

        th:first-child {
            background-color: var(--color-primary);
            color: var(--color-secondary);
        }

        tr:nth-of-type(even) {
            background-color: var(--color-light-background);
        }

        .event-bar {
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: var(--font-small);
        }

        .c1 {
            background-color: #264653;
        }

        .c2 {
            background-color: #2a9d8f;
        }

        .c3 {
            background-color: #e9c46a;
        }

        .c4 {
            background-color: #f4a261;
        }

        .c5 {
            background-color: #e76f51;
        }

        .event-bar:hover {
            cursor: pointer;
            filter: brightness(1.2);
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .tooltip {
            position: fixed;
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 10000;
            display: none;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.4;
            border: 1px solid #ddd;
        }

        .tooltip h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: var(--color-primary);
        }

        .tooltip .date-range {
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
            display: block;
        }

        .tooltip .summary {
            margin-top: 10px;
        }

        .tooltip img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {

            th,
            td {
                font-size: 0.75em;
                padding: 5px;
            }
        }
    </style>
</head>

<body>
    <section class="table-container" role="table" aria-label="Myanmar History Timeline">
        <table role="grid">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>200 BCE</th>
                    <th>1 CE</th>
                    <th>2 CE</th>
                    <th>3 CE</th>
                    <th>4 CE</th>
                    <th>5 CE</th>
                    <th>6 CE</th>
                    <th>7 CE</th>
                    <th>8 CE</th>
                    <th>9 CE</th>
                    <th>788</th>
                    <th>825</th>
                    <th>849</th>
                    <th>1050 CE</th>
                    <th>1057</th>
                    <th>1044</th>
                    <th>1215</th>
                    <th>1287</th>
                    <th>1297</th>
                    <th>1313</th>
                    <th>1315</th>
                    <th>1364</th>
                    <th>1406</th>
                    <th>1429</th>
                    <th>1482</th>
                    <th>1429</th>
                    <th>1510</th>
                    <th>1542</th>
                    <th>1539</th>
                    <th>1555</th>
                    <th>1563</th>
                    <th>1599</th>
                    <th>1740</th>
                    <th>1752</th>
                    <th>1757</th>
                    <th>1785</th>
                    <th>1824</th>
                    <th>1885</th>
                    <th>1942</th>
                    <th>1945</th>
                    <th>1948</th>
                    <th>1962</th>
                    <th>1988</th>
                    <th>2010</th>
                    <th>2011</th>
                    <th>2021</th>
                    <th>Present</th>
                    <!-- Add more time periods as needed -->
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic rows will be inserted here by JavaScript -->
            </tbody>
        </table>
        </div>

        <script>
            const headers = Array.from(document.querySelectorAll('thead th'));

            function findYearIndex(year) {
                return headers.findIndex(header => header.innerText.includes(year));
            }

            function addEventRow(name, start, end, className, wikiUrl) {
                const tableBody = document.querySelector('tbody');
                const row = document.createElement('tr');
                const startYear = parseInt(start), endYear = parseInt(end);
                let duration = isNaN(endYear) ? null : endYear - startYear;

                const nameCell = document.createElement('td');
                nameCell.textContent = name;
                row.appendChild(nameCell);

                const startIndex = findYearIndex(start);
                const endIndex = findYearIndex(end);

                if (startIndex >= 0 && endIndex >= 0) {
                    for (let i = 1; i < startIndex; i++) {
                        row.appendChild(document.createElement('td'));
                    }

                    const eventCell = document.createElement('td');
                    eventCell.colSpan = endIndex - startIndex + 1;
                    const eventBar = document.createElement('div');
                    eventBar.className = `event-bar ${className}`;
                    eventBar.textContent = duration !== null && duration > 0 ? `${duration} years` : 'Ongoing';
                    
                    // Add Wikipedia reference
                    eventBar.dataset.wikiUrl = wikiUrl;
                    eventBar.dataset.name = name;
                    eventBar.dataset.start = start;
                    eventBar.dataset.end = end;
                    
                    eventBar.addEventListener('click', () => {
                        if (wikiUrl) window.open(wikiUrl, '_blank');
                    });

                    eventBar.addEventListener('mouseenter', showTooltip);
                    eventBar.addEventListener('mouseleave', hideTooltip);
                    eventBar.addEventListener('mousemove', moveTooltip);

                    eventCell.appendChild(eventBar);
                    row.appendChild(eventCell);

                    for (let i = endIndex + 1; i < headers.length; i++) {
                        row.appendChild(document.createElement('td'));
                    }

                    tableBody.appendChild(row);
                } else {
                    console.error('Year range not found for', name);
                }
            }

            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            document.body.appendChild(tooltip);

            function showTooltip(e) {
                const bar = e.currentTarget;
                const name = bar.dataset.name;
                const start = bar.dataset.start;
                const end = bar.dataset.end;
                const wikiUrl = bar.dataset.wikiUrl;

                tooltip.innerHTML = `
                    <h3>${name}</h3>
                    <span class="date-range">${start} - ${end}</span>
                    <div class="summary">Loading info from Wikipedia...</div>
                `;
                tooltip.style.display = 'block';

                if (wikiUrl) {
                    const title = wikiUrl.split('/wiki/')[1].split('#')[0];
                    fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${title}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.extract) {
                                tooltip.innerHTML = `
                                    <h3>${name}</h3>
                                    <span class="date-range">${start} - ${end}</span>
                                    <div class="summary">${data.extract}</div>
                                    ${data.thumbnail ? `<img src="${data.thumbnail.source}" alt="${name}">` : ''}
                                `;
                            }
                        })
                        .catch(err => {
                            console.error('Wiki fetch error:', err);
                            tooltip.querySelector('.summary').textContent = 'Could not load Wikipedia information.';
                        });
                }
            }

            function hideTooltip() {
                tooltip.style.display = 'none';
            }

            function moveTooltip(e) {
                const padding = 20;
                let x = e.clientX + padding;
                let y = e.clientY + padding;

                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const toolW = tooltip.offsetWidth;
                const toolH = tooltip.offsetHeight;

                // Adjust horizontally
                if (x + toolW > winW) {
                    x = e.clientX - toolW - padding;
                }
                if (x < 0) x = 10;

                // Adjust vertically
                if (y + toolH > winH) {
                    // Try showing above cursor
                    y = e.clientY - toolH - padding;
                }
                
                // If still off-screen (now at the top), pin to top
                if (y < 0) {
                    // If the item is in the top half of the screen, show below cursor
                    // otherwise show at top of screen
                    if (e.clientY < winH / 2) {
                        y = e.clientY + padding;
                    } else {
                        y = 10;
                    }
                }

                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            }


            // Add events
            document.addEventListener('DOMContentLoaded', () => {
                addEventRow('Pyu city state', '200 BCE', '1050 CE', 'c1', 'https://en.wikipedia.org/wiki/Pyu_city-states');
                addEventRow('Mon Kingdoms', '825', '1057', 'c2', 'https://en.wikipedia.org/wiki/Mon_kingdoms');
                addEventRow('Arakanese Kingdoms', '788', '1406', 'c3', 'https://en.wikipedia.org/wiki/History_of_Rakhine');
                addEventRow('Early Pagan Kingdom', '849', '1044', 'c4', 'https://en.wikipedia.org/wiki/Pagan_Kingdom');
                addEventRow('Pagan Kingdom', '1044', '1297', 'c5', 'https://en.wikipedia.org/wiki/Pagan_Kingdom');
                addEventRow('Myinsaing/Pinya Kingdom', '1297', '1364', 'c1', 'https://en.wikipedia.org/wiki/Myinsaing_Kingdom');
                addEventRow('Sagaing Kingdom', '1315', '1364', 'c2', 'https://en.wikipedia.org/wiki/Sagaing_Kingdom');
                addEventRow('Ava Kingdom', '1364', '1555', 'c3', 'https://en.wikipedia.org/wiki/Kingdom_of_Ava');
                addEventRow('Prome Kingdom', '1482', '1542', 'c4', 'https://en.wikipedia.org/wiki/Prome_Kingdom');
                addEventRow('Hanthawaddy Kingdom', '1287', '1539', 'c5', 'https://en.wikipedia.org/wiki/Hanthawaddy_Kingdom');
                addEventRow('Shan States', '1215', '1563', 'c1', 'https://en.wikipedia.org/wiki/Shan_States');
                addEventRow('Mrauk U', '1429', '1785', 'c2', 'https://en.wikipedia.org/wiki/Kingdom_of_Mrauk_U');
                addEventRow('First Toungoo Empire', '1510', '1599', 'c3', 'https://en.wikipedia.org/wiki/Toungoo_dynasty');
                addEventRow('Nyaungyan', '1599', '1752', 'c4', 'https://en.wikipedia.org/wiki/Toungoo_dynasty#Restored_Toungoo_Kingdom_(Nyaungyan_dynasty)');
                addEventRow('Restored Hanthawaddy', '1740', '1757', 'c5', 'https://en.wikipedia.org/wiki/Restored_Hanthawaddy_Kingdom');
                addEventRow('Konbaung dynasty', '1752', '1885', 'c1', 'https://en.wikipedia.org/wiki/Konbaung_dynasty');
                addEventRow('British Colonial', '1824', '1948', 'c2', 'https://en.wikipedia.org/wiki/British_rule_in_Burma');
                addEventRow('Japanese occupation', '1942', '1945', 'c3', 'https://en.wikipedia.org/wiki/Japanese_occupation_of_Burma');
                addEventRow('Union Of Burma', '1948', '1962', 'c4', 'https://en.wikipedia.org/wiki/Post-independence_Burma,_1948%E2%80%931962');
                addEventRow('Socialist Republic', '1962', '1988', 'c5', 'https://en.wikipedia.org/wiki/Socialist_Republic_of_the_Union_of_Burma');
                addEventRow('Union Of Myanmar', '1988', '2010', 'c1', 'https://en.wikipedia.org/wiki/State_Law_and_Order_Restoration_Council');
                addEventRow('Republic of the Union Of Myanmar', '2011', '2021', 'c2', 'https://en.wikipedia.org/wiki/Myanmar');
                addEventRow('State Administration Council', '2021', 'Present', 'c3', 'https://en.wikipedia.org/wiki/State_Administration_Council');

            });
        </script>

</body>

</html>
